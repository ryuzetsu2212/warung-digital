<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>
    </defs>
    <rect width="400" height="300" fill="url(#bg)"/>
    <!-- Bakaran / Tusuk Sate -->
    <rect x="195" y="100" width="10" height="150" rx="5" fill="#a16207"/>
    <ellipse cx="200" cy="150" rx="45" ry="30" fill="#78350f" stroke="#451a03" stroke-width="3"/>
    <ellipse cx="200" cy="190" rx="45" ry="30" fill="#78350f" stroke="#451a03" stroke-width="3"/>
    <!-- Bumbu Kacang & Kecap -->
    <path d="M 160 150 Q 200 170 240 150" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round"/>
    <path d="M 160 190 Q 200 210 240 190" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round"/>
    <!-- Teks -->
    <text x="50%" y="45" dominant-baseline="middle" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.5))">🍢 Sate Ayam Madura</text>
</svg>