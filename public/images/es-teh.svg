<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>
    </defs>
    <rect width="400" height="300" fill="url(#bg)"/>
    <!-- Gelas / Tumbler -->
    <path d="M 160 80 L 170 190 Q 200 200 230 190 L 240 80 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Isi Es Teh (Warna Coklat Teh) -->
    <path d="M 165 100 L 172 180 Q 200 188 228 180 L 235 100 Z" fill="#b45309"/>
    <!-- Es Batu -->
    <rect x="180" y="110" width="20" height="20" rx="3" fill="#ffffff" opacity="0.6"/>
    <rect x="205" y="140" width="18" height="18" rx="3" fill="#ffffff" opacity="0.6"/>
    <!-- Sedotan -->
    <line x1="220" y1="50" x2="190" y2="190" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
    <!-- Teks -->
    <text x="50%" y="45" dominant-baseline="middle" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.5))">🥤 Es Teh Manis</text>
</svg>