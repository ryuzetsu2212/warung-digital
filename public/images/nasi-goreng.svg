<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>
    </defs>
    <rect width="400" height="300" fill="url(#bg)"/>
    <!-- Piring -->
    <ellipse cx="200" cy="180" rx="130" ry="60" fill="#cbd5e1" stroke="#94a3b8" stroke-width="4"/>
    <ellipse cx="200" cy="180" rx="110" ry="48" fill="#f8fafc"/>
    <!-- Nasi Goreng -->
    <ellipse cx="200" cy="180" rx="90" ry="38" fill="#d97706"/>
    <!-- Telur Mata Sapi -->
    <circle cx="180" cy="170" r="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="180" cy="168" r="14" fill="#fbbf24"/>
    <!-- Timun / Tomat hiasan -->
    <circle cx="260" cy="185" r="12" fill="#ef4444"/>
    <circle cx="130" cy="195" r="10" fill="#22c55e"/>
    <!-- Teks -->
    <text x="50%" y="45" dominant-baseline="middle" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.5))">🍳 Nasi Goreng Special</text>
</svg>