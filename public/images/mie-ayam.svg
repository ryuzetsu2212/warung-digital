<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>
    </defs>
    <rect width="400" height="300" fill="url(#bg)"/>
    <!-- Mangkok -->
    <ellipse cx="200" cy="190" rx="110" ry="50" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="4"/>
    <path d="M 90 190 Q 200 270 310 190 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Kuah Mie -->
    <ellipse cx="200" cy="190" rx="95" ry="38" fill="#fef08a"/>
    <!-- Mie -->
    <path d="M 140 190 Q 160 170 180 190 T 220 190 T 260 190" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <path d="M 150 185 Q 170 205 190 185 T 230 185 T 250 185" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round"/>
    <!-- Bakso / Ayam -->
    <circle cx="170" cy="185" r="14" fill="#78350f"/>
    <circle cx="230" cy="195" r="12" fill="#78350f"/>
    <circle cx="200" cy="175" r="10" fill="#22c55e"/>
    <!-- Teks -->
    <text x="50%" y="45" dominant-baseline="middle" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.5))">🍜 Mie Ayam Bakso</text>
</svg>